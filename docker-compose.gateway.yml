services:
  gateway:
    image: ${GATEWAY_IMAGE:-menoteam-agent-gateway:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    command: ["node", "dist/gateway/main.js"]
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      AGENT_GATEWAY_MASTER_KEY: ${AGENT_GATEWAY_MASTER_KEY:?set AGENT_GATEWAY_MASTER_KEY}
      AGENT_GATEWAY_CONNECTORS_JSON: ${AGENT_GATEWAY_CONNECTORS_JSON:?set AGENT_GATEWAY_CONNECTORS_JSON}
      AGENT_GATEWAY_MASTER_ENDPOINT: ${AGENT_GATEWAY_MASTER_ENDPOINT:?set AGENT_GATEWAY_MASTER_ENDPOINT}
      AGENT_GATEWAY_HOST: 0.0.0.0
      AGENT_GATEWAY_PORT: 3100
      AGENT_GATEWAY_ALLOWED_HOSTS: ${AGENT_GATEWAY_ALLOWED_HOSTS:?set AGENT_GATEWAY_ALLOWED_HOSTS}
      AGENT_GATEWAY_TRUST_PROXY: "true"
      AGENT_GATEWAY_REGISTRY_FILE: ${AGENT_GATEWAY_REGISTRY_FILE:-}
      AGENT_GATEWAY_PUBLIC_URL: ${AGENT_GATEWAY_PUBLIC_URL:-}
      AGENT_GATEWAY_ADMIN_PASSWORD: ${AGENT_GATEWAY_ADMIN_PASSWORD:-}
      WORK_MAP_MCP_URL: ${WORK_MAP_MCP_URL:-}
      WORK_MAP_MCP_API_KEY: ${WORK_MAP_MCP_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:?set SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:?set SLACK_SIGNING_SECRET}
      SLACK_BOT_USER_ID: ${SLACK_BOT_USER_ID:?set SLACK_BOT_USER_ID}
      SLACK_ALLOWED_USER_IDS: ${SLACK_ALLOWED_USER_IDS:?set SLACK_ALLOWED_USER_IDS}
      SLACK_ALLOWED_CHANNEL_IDS: ${SLACK_ALLOWED_CHANNEL_IDS:?set SLACK_ALLOWED_CHANNEL_IDS}
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - menoteam-gateway:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- --header="Host: $${AGENT_GATEWAY_ALLOWED_HOSTS%%,*}" http://127.0.0.1:3100/healthz',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  menoteam-gateway:
