name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Menoteam CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:16-alpine@sha256:1a66d744c1b459e13b05a8fca341da84cb63383e99ce262210efee5a319d4551
        env:
          POSTGRES_DB: menoteam_workbench_test
          POSTGRES_USER: menoteam
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U menoteam -d menoteam_workbench_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test onboarding preflight
        run: pnpm onboarding:check -- --self-test

      - name: Verify generic Master onboarding shape
        env:
          WORK_MAP_MCP_URL: https://work-map.invalid/mcp
          WORK_MAP_MCP_API_KEY: ci-onboarding-key-0123456789abcdef0123456789abcdef
          WORK_MAP_HARNESS: other
          WORK_MAP_ROLE: master
          WORK_MAP_CHANNEL: none
          WORK_MAP_MASTER_MENTION: '@Master'
        run: pnpm onboarding:check -- --no-network

      - name: Test
        env:
          WORK_MAP_TEST_DATABASE_URL: postgres://menoteam:ci-postgres-password@127.0.0.1:5432/menoteam_workbench_test
        run: |
          pnpm test --reporter=dot --reporter=json --outputFile.json=/tmp/menoteam-vitest-results.json
          node scripts/assert-ci-test-results.mjs /tmp/menoteam-vitest-results.json

      - name: Build
        run: pnpm build

      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-database-password
          DATABASE_URL: postgres://menoteam:ci-database-password@db:5432/menoteam
          MCP_API_KEY: ci-mcp-key
          DASHBOARD_PASSWORD: ci-dashboard-password
        run: docker compose config --quiet

      - name: Build production image
        run: docker build -t menoteam-work-map:ci .
