name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-database-password
          DATABASE_URL: postgres://menoteam:ci-database-password@db:5432/menoteam
          MCP_API_KEY: ci-mcp-key
          DASHBOARD_PASSWORD: ci-dashboard-password
        run: docker compose config --quiet

      - name: Build production image
        run: docker build -t menoteam-work-map:ci .
